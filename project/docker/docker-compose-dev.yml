services:
  mysql:
    image: mysql:8
    container_name: re-mysql
    ports:
      - "30601:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 're#mysql2022'
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    networks:
      - re-network
    restart: always

  redis:
    image: redis:8.4
    container_name: re-redis
    ports:
      - "30602:6379"
    command: redis-server --appendonly yes
    networks:
      - re-network
    restart: always

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: re-nacos
    ports:
      - "30603:8848"
      - "31603:9848"
      - "30605:8080"
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=re-nacos
      - NACOS_AUTH_IDENTITY_VALUE=re-nacos
      # re#nacos2022 base64 6 times
      - NACOS_AUTH_TOKEN=VmpGU1NtVkdXblJTYmxKVVlteEtWRmxzYUVOalJsSlZVVmhvVDFac1NsZFdWM1IzWWtaV1ZVMUVhejA9
    networks:
      - re-network
    restart: always

  minio:
    # 原 bitnamicharts/minio:17.0.21 镜像是损坏的占位manifest（仅75kB无二进制），
    # 容器会永远卡在Created状态，改用本地已有的 yuchenhui/minio 镜像
    image: yuchenhui/minio:RELEASE.2025-10-15T17-29-55Z-fullui
    container_name: re-minio
    ports:
      - "30606:9000"
      - "30607:9001"
    environment:
      - MINIO_ROOT_USER=re-minio
      - MINIO_ROOT_PASSWORD=re#minio2022
      - TZ=Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - re-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: re-elasticsearch
    ports:
      - "30608:9200"
      - "30609:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always

volumes:
  minio-data:

networks:
  re-network:
    driver: bridge

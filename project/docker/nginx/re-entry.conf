# 根元素博客 - 服务器入口反代（openresty）
# 域名规划（基于 re.lingjiatong.cn）：
#   re.lingjiatong.cn        -> 博客前端 (re-frontend:80)，/artalk/ 路径转评论服务
#   admin.re.lingjiatong.cn  -> 后台前端 (re-admin:80)
#   api.re.lingjiatong.cn    -> 后端网关 (re-gateway:9100)
#   file.re.lingjiatong.cn   -> Minio 对象存储 (minio:9000)，文章图片
# 证书由 acme.sh DNS-01 签发，安装到 ./certs/<域名>/ 下，见 README.md

# ========== 博客前台 ==========
server {
    listen                          8443 ssl;
    server_name                     re.lingjiatong.cn;
    server_tokens                   off;

    ssl_certificate                 /etc/nginx/certs/re.lingjiatong.cn/fullchain.cer;
    ssl_certificate_key             /etc/nginx/certs/re.lingjiatong.cn/re.lingjiatong.cn.key;
    ssl_session_cache               shared:SSL:10m;
    ssl_session_timeout             1d;

    client_max_body_size            50m;
    gzip                            on;
    gzip_min_length                 1k;
    gzip_comp_level                 5;
    gzip_types                      text/plain application/javascript text/css application/xml application/json image/svg+xml;

    # Artalk 评论服务（前端 VITE_ARTALK_SERVER 指向 https://re.lingjiatong.cn:8443/artalk）
    location /artalk/ {
        proxy_pass                  http://artalk:23366;
        proxy_set_header            Host $host;
        proxy_set_header            X-Real-IP $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass                  http://re-frontend:80;
        proxy_set_header            Host $host;
        proxy_set_header            X-Real-IP $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
    }
}

# ========== 管理后台（建议生产开启 auth_basic 或防火墙白名单） ==========
server {
    listen                          8443 ssl;
    server_name                     admin.re.lingjiatong.cn;
    server_tokens                   off;

    ssl_certificate                 /etc/nginx/certs/admin.re.lingjiatong.cn/fullchain.cer;
    ssl_certificate_key             /etc/nginx/certs/admin.re.lingjiatong.cn/admin.re.lingjiatong.cn.key;

    client_max_body_size            100m;

    # 如需 Basic Auth 保护，去掉下面两行注释并先用 htpasswd 生成密码文件
    # auth_basic                    "re-admin";
    # auth_basic_user_file          /etc/nginx/certs/.htpasswd;

    location / {
        proxy_pass                  http://re-admin:80;
        proxy_set_header            Host $host;
        proxy_set_header            X-Real-IP $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
    }
}

# ========== 后端 API 网关 ==========
server {
    listen                          8443 ssl;
    server_name                     api.re.lingjiatong.cn;
    server_tokens                   off;

    ssl_certificate                 /etc/nginx/certs/api.re.lingjiatong.cn/fullchain.cer;
    ssl_certificate_key             /etc/nginx/certs/api.re.lingjiatong.cn/api.re.lingjiatong.cn.key;

    # 上传文件走这里，放宽限制
    client_max_body_size            500m;

    location / {
        proxy_pass                  http://re-gateway:9100;
        proxy_set_header            Host $host;
        proxy_set_header            X-Real-IP $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
        proxy_read_timeout          120s;
    }
}

# ========== Minio 对象存储（文章图片等静态资源） ==========
server {
    listen                          8443 ssl;
    server_name                     file.re.lingjiatong.cn;
    server_tokens                   off;

    ssl_certificate                 /etc/nginx/certs/file.re.lingjiatong.cn/fullchain.cer;
    ssl_certificate_key             /etc/nginx/certs/file.re.lingjiatong.cn/file.re.lingjiatong.cn.key;

    client_max_body_size            500m;

    location / {
        proxy_pass                  http://minio:9000;
        proxy_set_header            Host $host;
        proxy_set_header            X-Real-IP $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
        proxy_read_timeout          300s;
        # presigned URL 校验依赖原始 Host
        proxy_buffering             off;
    }
}

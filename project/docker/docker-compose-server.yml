# 根元素博客 - 服务器单机版全量编排
# 用法：见同目录 README.md
# 唯一对外端口：8443（家宽 80/443 被封，路由器需将外部 8443 转发到本机 8443）
name: re-server

networks:
  re-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  minio-data:
  artalk-data:

services:
  # #################### 基础设施 ####################
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-re#mysql2022}
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行（按文件名顺序）：建 artalk 库 -> 导入 re 主库 -> 权限路由表
      - ./init-sql:/docker-entrypoint-initdb.d:ro
      - ../sql/re.sql:/docker-entrypoint-initdb.d/90-re.sql:ro
      - ../sql/auth_init.sql:/docker-entrypoint-initdb.d/91-auth-init.sql:ro
    networks:
      - re-network
    restart: always

  redis:
    image: redis:8.4
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - re-network
    restart: always

  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=re-nacos
      - NACOS_AUTH_IDENTITY_VALUE=re-nacos
      # re#nacos2022 base64 6 次，生产环境请用 .env 覆盖
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-VmpGU1NtVkdXblJTYmxKVVlteEtWRmxzYUVOalJsSlZVVmhvVDFac1NsZFdWM1IzWWtaV1ZVMUVhejA9}
      - TZ=Asia/Shanghai
    ports:
      # 仅绑定本机回环，供 ssh 隧道访问控制台，不暴露公网
      - "127.0.0.1:8848:8848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - re-network
    restart: always

  minio:
    # 官方 minio 镜像精简版无 mc 命令且 console 需要独立配置，使用 fullui 变体
    image: yuchenhui/minio:RELEASE.2025-10-15T17-29-55Z-fullui
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-re-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-re#minio2022}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - re-network
    restart: always
    # bucket 由后端服务启动时自动创建（MinioUtil.initBucket），无需手动

  artalk:
    image: artalk/artalk-go:latest
    environment:
      - TZ=Asia/Shanghai
      - ATK_LOCALE=zh-CN
      # 与 re_frontend 前端 Artalk.init 的 site 参数保持一致
      - ATK_SITE_DEFAULT=re_frontend
      # 前端页面域名白名单（CORS），必须与浏览器访问地址完全一致（含端口）
      - ATK_TRUSTED_DOMAINS=https://re.lingjiatong.cn:8443
      - ATK_DB_TYPE=mysql
      - ATK_DB_HOST=mysql
      - ATK_DB_PORT=3306
      - ATK_DB_USER=artalk
      - ATK_DB_PASSWORD=${ARTALK_DB_PASSWORD:-re#artalk2022}
      - ATK_DB_NAME=artalk
      - ATK_DB_CHARSET=utf8mb4
    volumes:
      - artalk-data:/data
    networks:
      - re-network
    restart: always
    depends_on:
      - mysql

  # #################### 后端微服务 ####################
  # 统一用 docker/Dockerfile.backend 多阶段构建：
  #   mvn package -P prod -Dnacos-server-addr=nacos:8848
  re-auth:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: re-auth
        JAR_NAME: re-auth
    image: re-auth:latest
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - nacos

  re-service-sys:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: service/re-service-sys/re-service-sys-server
        JAR_NAME: re-service-sys-server
    image: re-service-sys:latest
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - nacos

  re-service-article:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: service/re-service-article/re-service-article-server
        JAR_NAME: re-service-article-server
    image: re-service-article:latest
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - nacos

  api-backend:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: api/api-backend
        JAR_NAME: api-backend
    image: api-backend:latest
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - nacos

  api-file:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: api/api-file
        JAR_NAME: api-file
    image: api-file:latest
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - nacos

  re-gateway:
    build:
      context: ../..
      dockerfile: project/docker/docker/Dockerfile.backend
      args:
        MODULE: re-gateway
        JAR_NAME: re-gateway
    image: re-gateway:latest
    ports:
      # 仅绑定本机回环，便于服务器上直接 curl 调试
      - "127.0.0.1:9100:9100"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      - re-auth
      - re-service-sys
      - re-service-article
      - api-backend
      - api-file

  # #################### 前端（镜像由 build-frontend.sh 构建） ####################
  re-frontend:
    image: re-frontend:latest
    networks:
      - re-network
    restart: always

  re-admin:
    image: re-admin:latest
    networks:
      - re-network
    restart: always

  # #################### 入口反代（唯一对外服务） ####################
  re-entry:
    image: openresty/openresty:alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/re-entry.conf:/etc/nginx/conf.d/re-entry.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - re-network
    restart: always
    depends_on:
      - re-frontend
      - re-admin
      - re-gateway
      - artalk
      - minio

# 根元素博客 - 本地一键部署编排（与 docker-compose-server.yml 等价，用法见 README.md）
# 中间件端口映射与开发环境完全一致：mysql:30601 redis:30602 nacos:30603/31603/30605
#   minio:30606/30607 es:30608/30609 artalk:30610
# 首次启动自动完成：MySQL 建库（init-sql/init.sql）-> Nacos 导入配置（nacos-init 服务）
services:
  mysql:
    image: mysql:8
    container_name: re-mysql
    ports:
      - "30601:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 're#mysql2022'
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动（空数据目录）自动执行 init-sql/init.sql，若本地已有数据会自动跳过
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p're#mysql2022' --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - re-network
    restart: always

  redis:
    image: redis:8.4
    container_name: re-redis
    ports:
      - "30602:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - re-network
    restart: always

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: re-nacos
    ports:
      - "30603:8848"
      - "31603:9848"
      - "30605:8080"
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=re-nacos
      - NACOS_AUTH_IDENTITY_VALUE=re-nacos
      # re#nacos2022 base64 6 times
      - NACOS_AUTH_TOKEN=VmpGU1NtVkdXblJTYmxKVVlteEtWRmxzYUVOalJsSlZVVmhvVDFac1NsZFdWM1IzWWtaV1ZVMUVhejA9
      # 使用 MySQL 存储（替代内嵌 derby），库表与配置由 init-sql/init.sql 初始化
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=re-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=re#mysql2022
      - MYSQL_DATABASE_NUM=1
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    networks:
      - re-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || curl -sf 'http://127.0.0.1:8848/nacos/v1/ns/operator/metrics?keyword=nacos'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  minio:
    # 原 bitnamicharts/minio:17.0.21 镜像是损坏的占位manifest（仅75kB无二进制），
    # 容器会永远卡在Created状态，改用本地已有的 yuchenhui/minio 镜像
    image: yuchenhui/minio:RELEASE.2025-10-15T17-29-55Z-fullui
    container_name: re-minio
    ports:
      - "30606:9000"
      - "30607:9001"
    environment:
      - MINIO_ROOT_USER=re-minio
      - MINIO_ROOT_PASSWORD=re#minio2022
      - TZ=Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      # 精简镜像无 mc 命令，改用 MinIO 原生健康检查端点
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - re-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: re-elasticsearch
    ports:
      - "30608:9200"
      - "30609:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - re-network
    restart: always

  artalk:
    image: artalk/artalk-go:latest
    container_name: re-artalk
    ports:
      - "30610:23366"
    environment:
      - TZ=Asia/Shanghai
      - ATK_LOCALE=zh-CN
      # 与 re_frontend 前端 Artalk.init 的 site 参数保持一致
      - ATK_SITE_DEFAULT=re_frontend
      # CORS 可信域名：既兼容 vite dev server（8081），也兼容容器部署的前台（30151）
      - ATK_TRUSTED_DOMAINS=http://localhost:8081 http://127.0.0.1:8081 http://localhost:30151 http://127.0.0.1:30151
      - ATK_DB_TYPE=mysql
      - ATK_DB_HOST=re-mysql
      - ATK_DB_PORT=3306
      - ATK_DB_USER=artalk
      - ATK_DB_PASSWORD=re#artalk2022
      - ATK_DB_NAME=artalk
      - ATK_DB_CHARSET=utf8mb4
    volumes:
      - ./data/artalk:/data
    networks:
      - re-network
    restart: always
    depends_on:
      - mysql

  # #################### 后端微服务 ####################
  # 镜像默认本地已构建好（各服务自身 Dockerfile + 仓库根目录 build.sh），compose 只负责运行
  # 服务间互访直接用容器名（如 re-mysql:3306），端口映射仅供外部访问
  re-gateway:
    image: re-gateway:${RE_VERSION}
    container_name: re-gateway
    ports:
      - "9100:9100"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  re-auth:
    image: re-auth:${RE_VERSION}
    container_name: re-auth
    ports:
      - "9104:9104"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  re-service-sys:
    image: re-service-sys:${RE_VERSION}
    container_name: re-service-sys
    ports:
      - "9111:9111"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  re-service-article:
    image: re-service-article:${RE_VERSION}
    container_name: re-service-article
    ports:
      - "9112:9112"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  api-backend:
    image: api-backend:${RE_VERSION}
    container_name: api-backend
    ports:
      - "9101:9101"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  api-file:
    image: api-file:${RE_VERSION}
    container_name: api-file
    ports:
      - "9103:9103"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  api-frontend:
    image: api-frontend:${RE_VERSION}
    container_name: api-frontend
    ports:
      - "9102:9102"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - re-network
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  # #################### 前端（镜像由 build-frontend.sh 构建） ####################
  re-frontend:
    image: re-frontend:${RE_FRONTEND_VERSION}
    container_name: re-frontend
    ports:
      - "30151:80"
    networks:
      - re-network
    restart: always

  re-admin:
    image: re-admin:${RE_ADMIN_VERSION}
    container_name: re-admin
    ports:
      - "30150:80"
    networks:
      - re-network
    restart: always

networks:
  re-network:
    driver: bridge
